persistence true
persistence_location /mosquitto/data/
autosave_interval 300
log_dest stdout

listener 1883 0.0.0.0
# Local development only. Use password_file and TLS for deployment.
allow_anonymous true

# Bound memory per client: contract payloads are < 1 KiB, so 64 KiB rejects garbage early,
# and a disconnected QoS 1 client cannot queue unbounded messages.
max_packet_size 65536
max_queued_messages 1000
max_inflight_messages 20
# Forget persistent sessions of clients that never come back.
persistent_client_expiration 1d
