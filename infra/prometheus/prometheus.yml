global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: mqtt-kafka-bridge
    static_configs:
      - targets: ["mqtt-kafka-bridge:8000"]

  - job_name: edge-inference
    static_configs:
      - targets: ["edge-inference:8000"]

  - job_name: influx-sink
    static_configs:
      - targets: ["influx-sink:8000"]

  - job_name: safety-controller
    static_configs:
      - targets: ["safety-controller:8000"]

  - job_name: kafka-exporter
    static_configs:
      - targets: ["kafka-exporter:9308"]

  - job_name: influxdb
    metrics_path: /metrics
    static_configs:
      - targets: ["influxdb:8086"]

  - job_name: grafana
    metrics_path: /metrics
    static_configs:
      - targets: ["grafana:3000"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
