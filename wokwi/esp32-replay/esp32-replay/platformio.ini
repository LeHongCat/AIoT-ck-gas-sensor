; ESP32-S3 with 16 MB flash: the TabM INT8 weights (3.99 MB) plus WiFi/MQTT do not fit in 4 MB.
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
; Generated by tools/export_tabm_esp32.py; linked into flash as _binary_model_tabm_int8_bin_*.
board_build.embed_files = model/tabm_int8.bin
build_flags = -O2
build_unflags = -Os
; Wokwi needs bootloader + partition table + app in one image to honour the 16 MB partitions.
extra_scripts = post:merge_bin.py
lib_deps =
  bblanchon/ArduinoJson@^7.4.2
  knolleary/PubSubClient@^2.8
